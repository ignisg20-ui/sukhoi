plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ignisg20.sukhoi'
    compileSdk 34

    defaultConfig {
        applicationId "com.ignisg20.sukhoi"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Держим единый исходник игры: копируем HTML из корня репозитория в assets перед сборкой.
tasks.register('syncGame', Copy) {
    from("$rootDir/../sukhoi-sky-battle.html")
    into("$projectDir/src/main/assets")
}
tasks.named('preBuild') {
    dependsOn 'syncGame'
}
